# Builds the family web app and publishes it on GitHub Pages.
#
# One-time setup on github.com, in this repository:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → New repository secret:
#     SUPABASE_URL       the same value as in env.json
#     SUPABASE_ANON_KEY  the same value as in env.json (the anon/publishable key)
# Without the secrets the site still publishes, with the bundled photos only.

name: Publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - name: Write env.json from the repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Everything in the build is readable by anyone who opens the site.
          # A secret or service-role key there would unlock the whole database.
          case "$SUPABASE_ANON_KEY" in
            sb_secret_*)
              echo "::error::SUPABASE_ANON_KEY is a secret key. Use the anon or publishable key."
              exit 1 ;;
          esac
          if [[ "$SUPABASE_ANON_KEY" == *.*.* ]]; then
            payload=$(cut -d. -f2 <<< "$SUPABASE_ANON_KEY" | tr '_-' '/+')
            while (( ${#payload} % 4 )); do payload="$payload="; done
            role=$(base64 -d <<< "$payload" 2>/dev/null | jq -r '.role // empty')
            if [[ "$role" != "anon" ]]; then
              echo "::error::SUPABASE_ANON_KEY is not an anon key. Use the anon or publishable key."
              exit 1
            fi
          fi
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env.json

      - run: flutter pub get

      - run: flutter test

      - name: Build
        run: |
          # username.github.io is served from the root; any other repository
          # is served from /repository-name/.
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then base="/"; else base="/$repo/"; fi
          flutter build web --release \
            -t lib/main_viewer.dart \
            --dart-define-from-file=env.json \
            --base-href "$base"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
